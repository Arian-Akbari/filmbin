name: filmbin
description: فیلم‌بین — اپلیکیشن مدیریت و دنبال کردن فیلم و سریال
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state management (course deck 05)
  flutter_riverpod: ^2.6.1

  # networking (course deck 07)
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # storage (course deck 08)
  sqflite: ^2.4.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # ui
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  go_router: ^14.6.2
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  intl: ^0.20.2
  crypto: ^3.0.6
  http_parser: ^4.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/certs/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
